name: Password Hygiene

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove Firestore password handling
        shell: python
        run: |
          from pathlib import Path

          users = Path('src/components/admin/UsersManager.tsx')
          text = users.read_text(encoding='utf-8')
          text2 = text.replace("    setEditPassword(user.password || '');\n", "    setEditPassword('');\n")
          text2 = text2.replace("        password: editPassword,\n", "")
          text2 = text2.replace(
              "<span className=\"text-[10px] text-slate-400 font-normal\">Stored for CMS login verification</span>",
              "<span className=\"text-[10px] text-slate-400 font-normal\">Managed securely by Firebase Authentication</span>"
          )
          if text2 != text:
              users.write_text(text2, encoding='utf-8')

          types = Path('src/types/index.ts')
          type_text = types.read_text(encoding='utf-8')
          type_text2 = type_text.replace("  password?: string;\n", "")
          if type_text2 != type_text:
              types.write_text(type_text2, encoding='utf-8')

      - name: Commit
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/admin/UsersManager.tsx src/types/index.ts
          git commit -m "security: keep user passwords out of Firestore"
          git push
